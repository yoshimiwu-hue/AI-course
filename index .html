<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上學堂 - 課程總覽</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            margin: 0;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .course-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        .course-content {
            margin-bottom: 20px;
        }

        .course-badge {
            display: inline-block;
            background-color: #eff6ff;
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .course-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .course-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 0;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-sub);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI 課程專區</h1>
            <p>請點選下方課程卡片進入對應的學習單元</p>
        </header>

        <div class="course-grid">
            <!-- 第 1 課 -->
            <div class="course-card">
                <div class="course-content">
                    <span class="course-badge">Lesson 01</span>
                    <h3 class="course-title">AI 基礎概論與環境設定</h3>
                    <p class="course-desc">帶領您快速認識 AI 的基本原理，並完成線上學習環境與工具的註冊設定。</p>
                </div>
                <a href="https://example.com/course1" class="btn" target="_blank">前往上課</a>
            </div>

            <!-- 第 2 課 -->
            <div class="course-card">
                <div class="course-content">
                    <span class="course-badge">Lesson 02</span>
                    <h3 class="course-title">提示詞工程核心技巧</h3>
                    <p class="course-desc">學習如何精準對話與下指令，引導 AI 產出最高品質的解答與內容。</p>
                </div>
                <a href="https://example.com/course2" class="btn" target="_blank">前往上課</a>
            </div>

            <!-- 第 3 課 -->
            <div class="course-card">
                <div class="course-content">
                    <span class="course-badge">Lesson 03</span>
                    <h3 class="course-title">自動化工作流程應用</h3>
                    <p class="course-desc">結合各項實用工具，打造專屬自己的日常自動化幫手，大幅提升工作效率。</p>
                </div>
                <a href="https://example.com/course3" class="btn" target="_blank">前往上課</a>
            </div>
        </div>

        <footer>
            &copy; 2026 AI-course. All rights reserved.
        </footer>
    </div>

</body>
</html>
